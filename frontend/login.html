<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in – mediQ Health</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <!-- core.js: theme (before the page is drawn) + shared helpers -->
  <script src="core.js"></script>
</head>
<body>
  <div id="site-header"></div>

  <main class="auth-page">
    <h1 class="page-title">Log in</h1>
    <p class="lead">Patients and hospital staff use the same login.</p>

    <!-- novalidate: we show our own, clearer error messages (auth.js) -->
    <form id="login-form" class="enquiry-form" novalidate>
      <p id="form-error" class="form-error" role="alert"></p>
      <label>Email
        <input name="email" type="email" required autocomplete="email" aria-describedby="email-error">
        <span class="field-error" id="email-error"></span>
      </label>
      <label>Password
        <input name="password" type="password" required autocomplete="current-password" aria-describedby="password-error">
        <span class="field-error" id="password-error"></span>
      </label>
      <button type="submit">Log in</button>
    </form>
    <p class="auth-switch">New to mediQ Health? <a href="/signup.html">Create an account</a></p>
  </main>

  <div id="site-footer"></div>
  <script src="site.js"></script>
  <script src="auth.js"></script>
</body>
</html>
